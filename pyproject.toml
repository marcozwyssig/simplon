[build-system]
# 77 is the first setuptools that understands PEP 639: the SPDX `license` string
# and `license-files` below. Older ones fall back to the deprecated license table.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simplon"
version = "0.1.7"
description = "Delivery orchestrator for any software component that follows a CI/CD flow"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Marco Zwyssig" }]
dependencies = [
  # Ranges, not `==`. Inside this family every product has its own venv and exact pins are ideal, but
  # a published package's constraints are also its consumers' constraints, forever: an `==` here says
  # which pydantic and which click anyone combining with simplon may have. Each bound below states the
  # reason it exists, and a floor is not a ceiling - read the comment before tightening one.
  "typer~=0.12.5",       # >=0.12.5, <0.13. Typer is 0.x, so the MINOR is its breaking boundary, and the
                         # CLI generator drives Typer's own help/metavar/single-command-collapse
                         # behaviour rather than just its decorators (tests/test_typer_contract.py
                         # pins each of those decisions). 0.13+ is a deliberate upgrade, not a range.
  "click~=8.1.7",        # >=8.1.7, <8.2 - a CEILING: typer 0.12.5 predates Click 8.2's
                         # make_metavar(ctx) change, so 8.2 breaks the generated CLI. Lifts together
                         # with the typer bound, never on its own.
  "PyYAML>=6.0.3,<7",    # the manifest and catalogue loader. safe_load/safe_dump have been stable
                         # across all of 6.x, so only the major is a real boundary; the floor is
                         # simply the version this was verified against.
  # NOT listed: rich. The kernel imports nothing from it - the only mentions in the source are typer's
  # `rich_help_panel=` keyword, which is typer's integration and not ours. Both typer (rich>=10.11.0)
  # and textual (rich>=14.2.0) require it, so it is installed either way, and a floor of our own could
  # only be tighter than theirs: `>=15.0.0` would have refused a consumer holding rich 14.x for no
  # constraint simplon actually has. A dependency we do not import is a claim we cannot keep.
  "textual>=8.2.8,<9",   # the split-pane step TUI (headless fallback without it). Real API surface -
                         # App/ComposeResult, RichLog, Tree, TreeNode - which textual rearranges across
                         # majors, so the major IS the ceiling.
  "pydantic>=2.13.4,<3", # the manifest schema, written against the v2 API. v3 is a rewrite boundary.
  "jinja2>=3.1.4,<4",    # the clabrender template engine. Environment/Template are the whole surface
                         # in use and are 3.x-stable, so the major is the API boundary.
  "cryptography>=46.0.0",  # WireGuard X25519 keygen, imported lazily. A FLOOR, deliberately with no
                           # ceiling: 46.0.0 is the FIRST release publishing win_arm64 wheels, and
                           # below it pip builds from source and needs a Rust toolchain, so a product
                           # targeting that platform cannot install at all. The constraint is "not
                           # below 46" - `~=46.0.0` would read as a ceiling nobody asked for, over an
                           # API (X25519PrivateKey) that has been stable for years.
]

[project.optional-dependencies]
# The type gate's tooling, optional rather than runtime. `test:typecheck-python` (simplon.tasks.typecheck)
# shells out to mypy, and the TASK belongs to the kernel rather than to each product - so the tool it runs
# belongs beside it, and a product adopts the gate with one manifest line plus its own mypy.ini. But a
# product that never declares that command should not be told which mypy it may have, which is what a
# runtime dependency on a type checker does to everyone downstream. A product adopting the gate installs
# `simplon[typecheck]`; the task says so by name when mypy is missing.
typecheck = [
  "mypy~=1.18.2",
  "types-PyYAML~=6.0.12",  # a stub for a kernel dependency belongs beside the checker that reads it
]

[project.scripts]
simplon = "simplon.bootstrap:main"

[project.urls]
Homepage = "https://github.com/marcozwyssig/simplon"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
simplon = ["catalogue.yaml", "py.typed", "templates/*.j2"]
