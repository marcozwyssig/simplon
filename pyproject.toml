[build-system]
# 77 is the first setuptools that understands PEP 639: the SPDX `license` string
# and `license-files` below. Older ones fall back to the deprecated license table.
#
# setuptools-scm is what makes `version` dynamic below (#3). 8 is the first release with the
# `version_file` spelling this file uses (`write_to` is its deprecated predecessor); the range is open
# upwards because the config keys it reads have been stable since.
requires = ["setuptools>=77", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simplon"
# NO `version = "..."` here, and that absence is the point of #3. The number used to be typed into three
# files - this one, `src/simplon/__init__.py`, and the `simplon==` pin in `bootstrap.py` - while the git
# tag was a fourth spelling that nothing local paired with any of them. In one day that cost three
# collisions with concurrent sessions (0.1.4, 0.1.8, 0.1.9), and the 0.1.9 one could not have been
# prevented by looking first: the number a stranger had reserved for themselves was in no tag and in no
# commit on `main` at the time we looked. It was in a branch.
#
# So the version now comes from the tag, via setuptools-scm (`[tool.setuptools_scm]` at the bottom of this
# file). A tag is unique by construction: whoever pushes it first owns the number, and the second session
# is told so by `git push` instead of by a reviewer. There is nothing left here to disagree with it.
dynamic = ["version"]
description = "Delivery orchestrator for any software component that follows a CI/CD flow"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Marco Zwyssig" }]
dependencies = [
  # Ranges, not `==`. Inside this family every product has its own venv and exact pins are ideal, but
  # a published package's constraints are also its consumers' constraints, forever: an `==` here says
  # which pydantic and which click anyone combining with simplon may have. Each bound below states the
  # reason it exists, and a floor is not a ceiling - read the comment before tightening one.
  "typer~=0.12.5",       # >=0.12.5, <0.13. Typer is 0.x, so the MINOR is its breaking boundary, and the
                         # CLI generator drives Typer's own help/metavar/single-command-collapse
                         # behaviour rather than just its decorators (tests/test_typer_contract.py
                         # pins each of those decisions). 0.13+ is a deliberate upgrade, not a range.
  "click~=8.1.7",        # >=8.1.7, <8.2 - a CEILING: typer 0.12.5 predates Click 8.2's
                         # make_metavar(ctx) change, so 8.2 breaks the generated CLI. Lifts together
                         # with the typer bound, never on its own.
  "PyYAML>=6.0.3,<7",    # the manifest and catalogue loader. safe_load/safe_dump have been stable
                         # across all of 6.x, so only the major is a real boundary; the floor is
                         # simply the version this was verified against.
  # NOT listed: rich. The kernel imports nothing from it - the only mentions in the source are typer's
  # `rich_help_panel=` keyword, which is typer's integration and not ours. Both typer (rich>=10.11.0)
  # and textual (rich>=14.2.0) require it, so it is installed either way, and a floor of our own could
  # only be tighter than theirs: `>=15.0.0` would have refused a consumer holding rich 14.x for no
  # constraint simplon actually has. A dependency we do not import is a claim we cannot keep.
  "textual>=8.2.8,<9",   # the split-pane step TUI (headless fallback without it). Real API surface -
                         # App/ComposeResult, RichLog, Tree, TreeNode - which textual rearranges across
                         # majors, so the major IS the ceiling.
  "pydantic>=2.13.4,<3", # the manifest schema, written against the v2 API. v3 is a rewrite boundary.
  "jinja2>=3.1.4,<4",    # the clabrender template engine. Environment/Template are the whole surface
                         # in use and are 3.x-stable, so the major is the API boundary.
  "cryptography>=46.0.0",  # WireGuard X25519 keygen, imported lazily. A FLOOR, deliberately with no
                           # ceiling: 46.0.0 is the FIRST release publishing win_arm64 wheels, and
                           # below it pip builds from source and needs a Rust toolchain, so a product
                           # targeting that platform cannot install at all. The constraint is "not
                           # below 46" - `~=46.0.0` would read as a ceiling nobody asked for, over an
                           # API (X25519PrivateKey) that has been stable for years.
]

[project.optional-dependencies]
# The type gate's tooling, optional rather than runtime. `test:typecheck-python` (simplon.tasks.typecheck)
# shells out to mypy, and the TASK belongs to the kernel rather than to each product - so the tool it runs
# belongs beside it, and a product adopts the gate with one manifest line plus its own mypy.ini. But a
# product that never declares that command should not be told which mypy it may have, which is what a
# runtime dependency on a type checker does to everyone downstream. A product adopting the gate installs
# `simplon[typecheck]`; the task says so by name when mypy is missing.
typecheck = [
  "mypy~=1.18.2",
  "types-PyYAML~=6.0.12",  # a stub for a kernel dependency belongs beside the checker that reads it
]

[project.scripts]
simplon = "simplon.bootstrap:main"

[project.urls]
Homepage = "https://github.com/marcozwyssig/simplon"
# The documentation website (#2). PyPI renders these as the project page's sidebar links, which is the
# whole reason the site is published at a release rather than on every push: somebody who reaches it from
# the page of the version they just installed reads a page that describes that version.
#
# The address appears twice in this repository - here, and as `site.base_url` in simplon.yaml, where Hugo
# needs it to write absolute links. Neither can be derived from the other (a packaging file and a site
# build have no way to read each other), so tests/test_release_workflow.py asserts that they AGREE. Two
# spellings of one address is exactly the shape that rots quietly, and a test is the cheapest place to
# hold it together.
Documentation = "https://marcozwyssig.github.io/simplon/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
simplon = ["catalogue.yaml", "py.typed", "templates/*.j2"]

# --- the version, and the only place it comes from (#3) ---------------------------------------------------
#
# `version_scheme = "no-guess-dev"` is a deliberate choice over the default `guess-next-dev`, and the
# reason is the `simplon==` pin the scaffolder writes into a generated product's requirements.txt.
#
#   guess-next-dev  0.1.12 + 3 commits -> "0.1.13.dev3+g1234abc" - it names a version that DOES NOT EXIST
#                   yet and may never (the next tag could be 0.2.0). Nothing in that string points back to
#                   a release anybody can install.
#   no-guess-dev    0.1.12 + 3 commits -> "0.1.12.post1.dev3+g1234abc" - it names the release the tree
#                   DESCENDS FROM. `simplon.bootstrap.released_pin` reads 0.1.12 straight off the front of
#                   it, which is a version that is on PyPI, so a product scaffolded from an untagged
#                   working tree still gets a pin that installs.
#
# Both spellings sort correctly (a dev build is above the release it descends from and below the next
# one); only one of them can be turned back into something a `pip install` can resolve.
#
# The local part (`+g1234abc`, plus `.dYYYYMMDD` when the tree is dirty) is left at the default. PyPI
# REFUSES a local version, which makes it a free guard: a release built from anything other than a clean
# tree at the tag cannot be uploaded, whatever else went wrong.
[tool.setuptools_scm]
version_scheme = "no-guess-dev"
# Written into the package at build time, and it is what a tree with no `.git` reads - an installed wheel,
# an unpacked sdist. It is a build OUTPUT and therefore gitignored; `src/simplon/__init__.py` falls back to
# the installed distribution metadata when it is absent, which is the case in a fresh clone.
version_file = "src/simplon/_version.py"
