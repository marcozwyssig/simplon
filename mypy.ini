# Simplon's own type gate (#8), and the product's stated position on what it covers.
#
# WHY THIS FILE IS THE POINT OF #8. The ticket recorded 36 mypy findings here as environment noise -
# Python 3.14 locally against the CI's 3.12 - and the reasoning rested on the CI being green. The CI was
# green because it never ran mypy: `.github/workflows/ci.yml` ran `test all` and `build wheel`, and this
# repository, which SHIPS the type gate every other product adopts (`test:typecheck-python`,
# `simplon[typecheck]`), had never declared it for itself. Nothing was diverging between two
# environments; one of the two was simply not being asked. All 36 reproduce identically under a real
# 3.12, and one of them was a live bug (see the report, and `simplon/tasks/testrun.py::_verdict`).
#
# So the gate now runs on the kernel too, in CI, on the same tree that builds the wheel.
# `./simplon.sh test typecheck-python` is the one way to invoke it, here and everywhere else.

[mypy]
# The two trees this repository SHIPS, and both are checked. `src` is the kernel - the code every
# consumer installs, and the code whose py.typed file promises consumers that these annotations mean
# something. `orchestrator/` is simplon's own product shim: it is the composition root the scaffolder
# writes for every product, so a type error there is a type error in the template every product starts
# from.
files = src, orchestrator/src/python/orchestrator
mypy_path = src:orchestrator/src/python

# The floor the wheel promises. `requires-python = ">=3.11"` in pyproject.toml is a commitment to
# consumers, and a checker running at the DEVELOPER's interpreter would let a 3.12-only or 3.13-only
# spelling through and break the floor for anyone holding to it. Pinned to the floor rather than to the
# CI's version deliberately: the CI is one consumer of this package, not the definition of who may
# install it. (It is also why the 3.14-vs-3.12 story in #8 could never have been the cause - this
# setting, not the interpreter mypy happens to run on, is what decides the language level.)
python_version = 3.11

# THE OMISSION THAT IS NOT A PATH. By default mypy does not look INSIDE a function that has no
# annotations - it checks that the function exists and skips its body. On this tree that meant
#
#     def unannotated_but_broken(n):
#         return "a string" + n + [1, 2, 3].undefined_attribute
#
# passing `Success: no issues found` outright, measured. The exclusions further down are stated by path
# and are easy to read; this one is stated by nothing at all, and it is far larger - it is every body in
# the tree that nobody has annotated yet, which is exactly where a finding would be least expected and
# most useful. A gate is worth what it looks at.
#
# It costs nothing today: turning it on adds ZERO findings, measured, so the only thing it changes is the
# next unannotated body somebody writes. `disallow_untyped_defs` is a DIFFERENT decision and deliberately
# not taken here - it costs 18 findings and would be a demand to annotate rather than a demand to be
# correct, which is a conversation, not a fix for #8.
check_untyped_defs = True

# Findings must not be able to hide. `warn_unused_ignores` is the load-bearing one: this tree contains
# exactly one `# type: ignore` (the generated `_version.py` import from #3, which is absent in a source
# checkout and present in a built wheel), and the whole failure mode #8 describes is a suppression
# outliving the thing it suppressed.
warn_unused_ignores = True
warn_redundant_casts = True
warn_unused_configs = True
no_implicit_optional = True

# NOT COVERED BY PATH, and each absence is a decision rather than an oversight. (The absence that is not
# a path - unannotated function bodies - is closed above, not listed here.)
#
#   tests/  - the suite is 1300+ tests whose fixtures are deliberately loose: monkeypatched module
#             attributes, SimpleNamespace stands-in for product objects, lambdas standing in for
#             resolved refs. Typing them would mean annotating stubs to match code that the tests exist
#             to hold still, which inverts the direction the checking should flow in. The tests' own
#             gate is that they pass.
#   site/, docs/, build/, dist/ - not Python this repository ships.
#
# THIRD-PARTY STUBS. Everything the kernel imports either ships `py.typed` (typer, click, pydantic,
# jinja2, textual, cryptography) or has a stub in `simplon[typecheck]` (types-PyYAML). Nothing is
# excused below, and nothing needs to be: a blanket `ignore_missing_imports = True` would silently
# absorb the day a real dependency loses its types, which is the same shape of quiet that #8 was.
