# GENERATED from simplon.yaml by `simplon support github workflows`. Do not edit.
#
# The steps below are the product's own commands, resolved against simplon.yaml's command tree, so
# a command that is renamed or removed breaks generation instead of leaving a workflow calling
# something that is gone. `--check` reports drift and returns 1.

name: ci
on:
  pull_request: null
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read

jobs:

  # A self-hosted runner that is itself an LXC container. Python and docker are reached as on a
  # self-hosted Debian machine; emulation cannot be registered from inside a job, because
  # `/proc/sys/fs/binfmt_misc/register` is refused there (si#358, #722), so it is registered once
  # by hand with `support:ci-arm64`.
  #
  # si#860: `test suite` names `ci: emulates:` (linux/arm64), and this job's runner kind `self-
  # hosted-container` cannot register emulation, so no step does it here and a leaf running a
  # foreign binary fails with `Exec format error` unless the emulator is registered once on the
  # machine, by hand and as root, with `support:ci-arm64` (si#358, #722).
  #
  # si#858: derived from this product's command tree, which declares no `workflows: ci:`. This job
  # runs every unattended leaf of `ci build` and `ci test` in manifest order, a consumer after its
  # producer. Every leaf after the first runs unless the run is cancelled or a preparation step
  # went red, so one red gate hides none of the others; a consumer also waits for its producer's
  # success, so a red producer shows as one red step and its consumer as skipped. A leaf that runs
  # after all the others (the report) runs last and always.
  #
  # Left out:
  # `build handoff-canary` - runs across a job boundary in handoff-canary.yml (si#639, spec 5.3a);
  #   one job would prove nothing
  # `build homebrew-formula` - needs a tagged commit: the formula refuses a wheel with a local
  #   version (si#543), measured on ghr-8 in PR #890; the release checks the formula
  # `build model` - it is the `by:` of a `generated:` entry, which `test generated`
  #   (`test:generated`) regenerates and compares with the committed tree itself; run before it in
  #   the same job, it would leave that gate comparing the regenerated tree with itself (si#886)
  # `test walk` - it needs a person at the terminal (`unattended: false`)
  # `test homebrew-formula` - needs a tagged commit: the formula refuses a wheel with a local
  #   version (si#543), measured on ghr-8 in PR #890; the release checks the formula
  # `test handoff-canary` - runs across a job boundary in handoff-canary.yml (si#639, spec 5.3a);
  #   one job would prove nothing
