name: ci
on: [push, pull_request]

jobs:
  self-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Stage zero is the working tree. The launcher provisions its own venv and
      # installs this checkout with `-e .`, so the code under test is the code
      # that runs the test -- a commit that breaks CLI assembly fails here, in
      # the same round, rather than after a release.
      - run: ./simplon.sh test all
      - run: ./simplon.sh build wheel
