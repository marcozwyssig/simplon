# GENERATED from simplon.yaml by `simplon support workflows`. Do not edit.
#
# The steps below are the product's own commands, resolved against simplon.yaml's command tree, so
# a command that is renamed or removed breaks generation instead of leaving a workflow calling
# something that is gone. `--check` reports drift and returns 1.

# Every push and every pull request, and it is the SAME three commands a developer types in a
# checkout - not a pipeline's own spelling of them. Two routes to one verdict is the shape that
# produced si#8, where the CI was green for months because it had never run mypy at all.
name: ci
on:
  - push
  - pull_request

jobs:

  # Stage zero is the working tree. The launcher provisions its own venv and installs this
  # checkout with `-e .`, so the code under test is the code that runs the test - a commit that
  # breaks CLI assembly fails here, in the same round, rather than after a release.
  self-build:
    runs-on: ubuntu-latest
    steps:
      # The full history, and it is a precondition rather than an optimisation (si#3).
      # The version comes from the git tag via setuptools-scm, and checkout's default shallow
      # clone has the tag without the history behind it: the derivation then produces a version
      # that is merely WRONG instead of failing, and PyPI accepts the wheel. Emitted by the
      # generator rather than declared per job, so a workflow written later inherits the rule
      # instead of somebody having to remember it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: ./simplon.sh test all
      # The type gate (si#8), and it runs HERE rather than as a `mypy src` step of its own,
      # because the command has to be the same one a developer runs. si#8 was raised as "mypy is
      # red locally and green in CI, so it must be the Python version" - and the CI had simply
      # never run mypy at all. Two ways to reach one verdict is the shape that produced that; one
      # way is the fix. What it checks and what it excuses is stated in mypy.ini, not here.
      - run: ./simplon.sh test typecheck-python
      - run: ./simplon.sh build wheel
