        run: exec ./simplon.sh test generated
      - if: ${{ !cancelled() && steps.prepare_docker.outcome == 'success' && steps.prepare_disk.outcome == 'success'
          && steps.prepare_install.outcome == 'success' && steps.leaf_build_image.outcome == 'success' }}
        run: exec ./simplon.sh test image --platform linux/amd64
      - if: ${{ !cancelled() && steps.prepare_docker.outcome == 'success' && steps.prepare_disk.outcome == 'success'
          && steps.prepare_install.outcome == 'success' }}
        run: exec ./simplon.sh test model
      - if: ${{ !cancelled() && steps.prepare_docker.outcome == 'success' && steps.prepare_disk.outcome == 'success'
          && steps.prepare_install.outcome == 'success' }}
        run: exec ./simplon.sh test manifest-model
      - if: always()
        run: exec ./simplon.sh test report
