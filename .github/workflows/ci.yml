name: ci
on: [push, pull_request]

jobs:
  self-build:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 (#3). The version comes from the git tag via setuptools-scm, and checkout's
      # default shallow clone has no tags at all - the kernel would then call itself something the
      # scaffolder cannot turn into a released pin, and a suite that is green in every checkout would go
      # red only here. Full history is a precondition of the build, not an optimisation of it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Stage zero is the working tree. The launcher provisions its own venv and
      # installs this checkout with `-e .`, so the code under test is the code
      # that runs the test -- a commit that breaks CLI assembly fails here, in
      # the same round, rather than after a release.
      - run: ./simplon.sh test all
      # The type gate (#8), and it runs HERE rather than as a `mypy src` step of its own, because the
      # command has to be the same one a developer runs. #8 was raised as "mypy is red locally and green
      # in CI, so it must be the Python version" - and the CI had simply never run mypy at all. Two ways
      # to reach one verdict is the shape that produced that; one way is the fix. What it checks and what
      # it excuses is stated in mypy.ini, not here.
      - run: ./simplon.sh test typecheck-python
      - run: ./simplon.sh build wheel
