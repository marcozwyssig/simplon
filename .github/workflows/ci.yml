  # si#862, #789: release.yml consumes these, and this run keeps none of them for it to promote:
  # `kernel-checked` - `test image` produces it, and CI runs it with `ci: params:`, narrower than
  #   the release
  # `kernel-notes` - `release notes` produces it, and it is not a CI leaf (it is in the 'release'
  #   group)
  # `simplon-formula` - `build homebrew-formula` produces it, and ci.yml leaves it out: needs a
  #   tagged commit: the formula refuses a wheel with a local version (si#543), measured on ghr-8
  #   in PR #890; the release checks the formula
  # `simplon-formula-checked` - `test homebrew-formula` produces it, and ci.yml leaves it out:
  #   needs a tagged commit: the formula refuses a wheel with a local version (si#543), measured on
  #   ghr-8 in PR #890; the release checks the formula
  ci:
    runs-on: ghr-8
    env:
      DELIVERY_DOCKER_BOOTSTRAP: '1'
