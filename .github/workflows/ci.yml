          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: tests/reports/*.html
          if-no-files-found: error
          retention-days: 90
      - if: always()
        continue-on-error: true
        run: exec ./simplon.sh support ci-disk-cleanup

