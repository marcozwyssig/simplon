        with:
          fetch-depth: 0
          # si#622: the job's token is not left in .git/config for every step, build and tests
          # included, to read. A `token: github` step gets it in its own `env:` and hands it to git itself.
          persist-credentials: false
      # si#623: can the kernel start a container from where it uses docker - inside the kernel
      # container through the mounted socket, or on the host? Measured on ghr-8 on 2026-11-11: after a runner
      # update every docker call the kernel made was refused with `permission denied ... /var/run/docker.sock`
      # while the disk preflight stayed green, and the run went thirty steps before it stopped. So this runs a
      # pinned container first, and a refusal names the uid and groups, the socket's uid, gid and mode, the
      # `--group-add` gids and the way out.
      - run: exec ./simplon.sh support ci-docker-preflight
      # si#327, and it is a fact about the MACHINE rather than about this product. A self-hosted-debian runner is
      # the same machine on the next job, so what a build leaves behind - images, stopped containers, build cache -
      # accumulates until something fails a long way from the cause. This account's own CI lost a day to it: every
      # gate green, then `build image` dying on `E: You don't have enough free space in /var/cache/apt/archives/`,
      # and on a second run a step with no log at all and a runner gone offline.
      #
      # So the disk is measured BEFORE the product's own steps, and given back after them whatever they decided.
      # The preflight refuses the job when the docker data filesystem is under 15% free - one second
      # instead of eight minutes, and a message that names the disk. The cleanup carries `continue-on-error`
      # deliberately: handing space back is not a verdict about this product's code and must not be able to fail a
      # run that passed.
      - run: exec ./simplon.sh support ci-disk-preflight
      - run: exec ./simplon.sh test suite
      # The type gate (si#8), and it runs HERE rather than as a `mypy src` step of its own,
      # because the command has to be the same one a developer runs. si#8 was raised as "mypy is
      # red locally and green in CI, so it must be the Python version" - and the CI had simply
      # never run mypy at all. Two ways to reach one verdict is the shape that produced that; one
      # way is the fix. What it checks and what it excuses is stated in mypy.ini, not here.
      - run: exec ./simplon.sh test typecheck-python
      # The staleness gate (si#240), and CI is where it earns its keep: it regenerates the two
      # committed generated files and fails if either is not what its own command produces. 0794e24
      # is why - a manifest change that never reached the shell completion, and `main` red with an
      # uncompletable command until a person noticed. It runs AFTER the type gate and before the
      # wheel, because a stale completion is a fact about the tree rather than about the build, and
      # a reader looking at a red run should see it beside the other verdicts about the tree.
      - run: exec ./simplon.sh test generated
      # simplon's own pipeline model, checked by firn in its pinned image (si#371). A fact about the
      # tree like the two before it, so it sits beside them. The image is public and the runner
      # already reaches docker for the image build below, so it needs nothing new.
      - run: exec ./simplon.sh test model
      # simplon's manifest, exported fresh and checked by firn against the M2 the kernel ships (si#522):
      # the route a product takes, beside the check of the tree it is copied from.
      - run: exec ./simplon.sh test manifest-model
      - run: exec ./simplon.sh build wheel
      # The kernel's own container image (si#200), BUILT here and published nowhere. Building
      # needs no credential, so the half of the loop that can run on every push does - which is
      # what keeps the Dockerfile from rotting between the releases that publish it, which are
      # the other half. It is the same argument as every other step in this file: a command a
      # developer can type, run by the pipeline rather than restated in it.
      #
      # It goes after the wheel and before the prose gate for the reason the next note gives:
      # a verdict over code is read before a verdict over prose.
      # amd64 ONLY (si#368): the image declares arm64 too, and building that here would put an
      # emulated stage on this runner on every push. A release builds both.
      - run: exec ./simplon.sh build image --platform linux/amd64
      # The release-notes guard (si#89), and it is LAST on purpose. A gate that fails early
      # hides everything behind it, and this one rules on prose rather than on code: a
      # release section still to be written must not stop a reader from seeing whether the
      # suite, the type gate and the wheel are green. It is a real gate all the same - a
      # tagged release nobody wrote up is a failure this repository has already shipped once.
      #
      # Its range is `<last tag>..HEAD` of whatever this run checked out, so it says
      # different things under the two triggers this workflow declares, and both are
      # correct: a `push` to main has the merge that just landed in range, and a
      # `pull_request` run checks out `refs/pull/N/merge` - the branch AS MERGED with the
      # base - so a branch green on its own tip goes red when the base moves. The command
      # prints what HEAD resolved to on every run, which is what makes that legible instead
      # of surprising. `fetch-depth: 0` above is a precondition for it too: with no tags
      # there is no released version to measure the page against.
