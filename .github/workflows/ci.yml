      # Every later leaf waits for this step's success: a missing toolchain would otherwise turn every leaf red.
      - id: prepare_install
        run: exec ./simplon.sh support install
      - id: leaf_build_wheel
        run: exec ./simplon.sh build wheel
      - if: ${{ !cancelled() && steps.prepare_docker.outcome == 'success' && steps.prepare_disk.outcome == 'success'
          && steps.prepare_install.outcome == 'success' }}
        run: exec ./simplon.sh build reference
      - if: ${{ !cancelled() && steps.prepare_docker.outcome == 'success' && steps.prepare_disk.outcome == 'success'
          && steps.prepare_install.outcome == 'success' }}
        run: exec ./simplon.sh build acceptance
      - if: ${{ !cancelled() && steps.prepare_docker.outcome == 'success' && steps.prepare_disk.outcome == 'success'
          && steps.prepare_install.outcome == 'success' }}
        run: exec ./simplon.sh build site
      - id: leaf_build_image
        if: ${{ !cancelled() && steps.prepare_docker.outcome == 'success' && steps.prepare_disk.outcome == 'success'
          && steps.prepare_install.outcome == 'success' }}
        run: exec ./simplon.sh build image --platform linux/amd64
      - if: ${{ !cancelled() && steps.prepare_docker.outcome == 'success' && steps.prepare_disk.outcome == 'success'
          && steps.prepare_install.outcome == 'success' }}
        run: exec ./simplon.sh test suite
      - if: ${{ !cancelled() && steps.prepare_docker.outcome == 'success' && steps.prepare_disk.outcome == 'success'
          && steps.prepare_install.outcome == 'success' }}
        run: exec ./simplon.sh test typecheck-python
      - if: ${{ !cancelled() && steps.prepare_docker.outcome == 'success' && steps.prepare_disk.outcome == 'success'
