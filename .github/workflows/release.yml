            echo "- **image**: \`$ref\` published; pin branch \`$branch\` pushed; **pull request NOT opened**." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "- **image**: \`$ref@${digest}\` published; pin pull request opened from \`$branch\`, ci.yml dispatched on it." >> "$GITHUB_STEP_SUMMARY"
