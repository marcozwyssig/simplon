name: release
on:
  push:
    tags: ["v*"]

# THE RELEASE GUARD (#23, built with #32) BLOCKS IN THE COMMAND AND REPORTS HERE. Two different jobs,
# and the split is the whole design - so read what is NOT true before the part that is.
#
# NOT TRUE, and it was written here in an earlier draft: "a guard in this workflow would be bypassed by
# `git tag && git push`, because that runs no workflow step". Measured, it is the reverse. The trigger
# above has no branch filter, so a tag pushed by hand from anywhere starts this workflow - every one of
# the 14 tags in this repository was pushed by hand and every run of this file came from one of them.
# The bypassable guard is the one in the COMMAND: type the two git commands and it never runs. This one
# sees every release there is.
#
# WHAT IS TRUE. `./simplon.sh release tag` REFUSES a commit `main` does not carry, and that refusal is
# deliberately escapable - #23 wants a hotfix off `main` to remain possible, and two typed git commands
# are a better escape hatch than a flag, because a person typing them has decided something. That
# decision must stay available, so this file must not turn it back into a hard stop.
#
# But an exception nobody ever hears about is not a loud exception, it is an unnoticed one - and until
# this step existed, that is exactly what it was: open AND invisible. So the step below REPORTS. It
# names the case in the log and in the run summary, fails nothing, and runs before the publish, because
# the ordering is the point: a tag cannot be taken back, a publication can still be stopped by whoever
# is watching.
#
# One rule, two behaviours, and no second copy of the decision: the command decides what to refuse, this
# step decides nothing at all.

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # Trusted Publishing: no API token in the repo
    steps:
      # fetch-depth: 0, and it is load-bearing (#3). The version is DERIVED from the tag by
      # setuptools-scm, and checkout's default depth of 1 gives it the tag without the history behind
      # it: it then produces a version that is merely wrong rather than failing, and PyPI accepts the
      # wheel. The old hand-written gate below was loud; a shallow clone is not, which is why the depth
      # is stated here instead of inherited. tests/test_release_workflow.py holds it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Is this tag on main? REPORTS, never blocks - see the head of this file. It runs before the
      # tests and the publish so that a human watching the run learns it while there is still something
      # to stop; after `pypa/gh-action-pypi-publish` there would be nothing left to decide.
      #
      # It fetches `main` itself rather than trusting the checkout to have left a remote-tracking ref
      # behind: this workflow is checked out AT A TAG, and what `actions/checkout` leaves under
      # `refs/remotes/` is its business, not something this step should assume. An unanswerable question
      # is reported as unanswerable - never as "off main", which would cry wolf on every fetch failure.
      #
      # `exit 0` on every path, and there is deliberately no `exit 1` anywhere in it.
      # tests/test_release_workflow.py holds that, because a reporting step that quietly became a gate
      # would close the hotfix route #23 asked to keep open, and nobody would notice until a release
      # they needed was refused.
      - name: Is this tag on main? (report only)
        run: |
          stale=""
          if ! git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main; then
            stale=" (origin could not be reached, so this reads a possibly stale ref)"
          fi
          if ! git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null; then
            echo "::warning::origin/main could not be read, so ${GITHUB_REF_NAME} is NOT CLASSIFIED - nothing here says whether it is on main."
            echo "- **${GITHUB_REF_NAME}**: not classified (\`origin/main\` unreadable)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          main_head="$(git rev-parse --short refs/remotes/origin/main)"
          if git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "${GITHUB_REF_NAME} is cut from a commit main carries${stale}."
            echo "- **${GITHUB_REF_NAME}**: on \`main\` (${GITHUB_SHA}, main at ${main_head})${stale}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::warning::${GITHUB_REF_NAME} was cut from ${GITHUB_SHA}, which origin/main (${main_head}) does not carry${stale}. This release is going out anyway - 'release tag' refuses this case, so the tag was pushed by hand. If that was not deliberate, stop the run before the publish step."
          {
            echo "- **${GITHUB_REF_NAME}**: OFF \`main\`${stale}."
            echo "  - tagged commit: \`${GITHUB_SHA}\`"
            echo "  - \`origin/main\`: \`${main_head}\`"
            echo "  - \`./simplon.sh release tag\` refuses this, so the tag was pushed by hand. Reported, not blocked - a hotfix off \`main\` is allowed to exist, but not to be invisible."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      # The release gate: tests, then the type gate, then the wheel, then PyPI. The launcher
      # provisions its own venv and installs this checkout with `-e .[typecheck]`, so no
      # separate install step is needed here (the same redundant step was
      # dropped from ci.yml for the same reason). The wheel check in tests/
      # installs the built package and loads its catalogue from
      # site-packages -- it is the only one that catches a path escape
      # before it ships.
      #
      # THE TYPE GATE IS HERE, and not only in ci.yml, because this is the path that reaches consumers
      # (#8). `ci.yml` triggers on `push`, which includes tags, so in practice a tagged commit is checked
      # by it today - but that is a PARALLEL workflow with no dependency on this one, not a gate on this
      # one. Narrow the `ci` trigger some day and the release path loses the check without anybody's diff
      # showing it. Repeating a step is the cheap half of that trade; the expensive half is publishing a
      # wheel nothing typechecked.
      #
      # That would have been si#8 committed a second time, one level up: a pipeline that is green because
      # a question is not asked. tests/test_type_gate.py holds it as a RULE over the whole workflows
      # directory - any job that runs the suite runs the gate - so a future workflow inherits it instead
      # of being remembered. It knows two spellings of "runs the suite" since si#156, `test all` and
      # `test suite`, and this file is the one that still says the first.
      #
      # AND `test all` CARRIES A THIRD VERDICT HERE since si#156: it is an aggregate over the pytest
      # suite and `test release-notes`, so this step also rules on whether the release being cut has a
      # section naming every ticket it carries. That is the guard si#89 built acting one step earlier
      # than it used to, and it is deliberate - the notes are written BEFORE the tag (si#3), so a tag
      # whose section nobody wrote stops the publish rather than following it. The consequence to know:
      # this step can now go red on prose while every line of code is fine, and the message names the
      # missing numbers.
      - run: ./simplon.sh test all
      - run: ./simplon.sh test typecheck-python
      - run: ./simplon.sh build wheel
      # WHAT REPLACED "the tag must name the version being published" (#3).
      #
      # That step compared the tag a human typed with the number a human had typed into pyproject.toml.
      # There is no number in pyproject.toml any more, and comparing the tag with a version derived FROM
      # the tag would be a tautology - so the old step is gone rather than rewritten.
      #
      # What is NOT tautological is whether the derivation ran on the inputs it needed. Three things
      # make it quietly produce the wrong string: a shallow clone (guarded above, but a default can be
      # restored by someone who does not know why it is there), a dirty working tree, which appends a
      # local `+g….dYYYYMMDD` segment, and a tag that is not where the build is standing. All three are
      # visible in ONE place - the filename of the wheel that was actually built - so that is what is
      # read. Recomputing the version here would only repeat whatever mistake produced it.
      #
      # It runs AFTER the build for that reason, and before the upload: PyPI rejects a local version
      # outright, but by then the tests have run and the failure arrives as a red publish rather than
      # as an answer.
      #
      # WHAT THE OLD CHECK CAUGHT AND THIS ONE CANNOT, stated because it is a real loss and not a wash.
      # A MISTYPED tag - `v0.1.31` for `v0.1.13`. The old step held two independently produced numbers
      # against each other, so a typo in one was caught by the other; two typos would have had to agree.
      # There is only one number now, and a single statement cannot be falsified by itself: 0.1.31 is
      # derived from the tag, matches it, and publishes.
      #
      # What still catches a typo is PyPI, and only in one direction. RE-USING a number is refused as a
      # duplicate. SKIPPING ahead is refused by nobody: 0.1.31 goes up, and the versions between it and
      # 0.1.13 are burnt.
      #
      # That is a DIFFERENT CUT, chosen deliberately, not an equal trade. What it buys is that a number
      # cannot be claimed twice by two people at once - which happened three times in one day (0.1.4,
      # 0.1.8, 0.1.9), cost two renumberings, and could not be prevented by looking first, because the
      # number a stranger had reserved was in a branch nobody else could see. A typo is one person's
      # slip, visible in the command they are typing; a collision is two people's correct behaviour
      # producing a wrong result. Trading the second for the first is the trade this ticket is.
      - name: The wheel that was built must be the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          built="$(ls dist/simplon-*.whl | sed -E 's|.*/simplon-([^-]+)-.*|\1|')"
          test "$built" = "$version" || {
            echo "tag ${GITHUB_REF_NAME} was built as ${built}, not ${version}."
            echo "The version is derived from git by setuptools-scm, so a mismatch means the derivation"
            echo "saw something other than a clean checkout standing exactly on the tag: a shallow"
            echo "clone (fetch-depth), an unclean working tree (a '+local' segment), or a tag that does"
            echo "not point at this commit."
            exit 1
          }
      - uses: pypa/gh-action-pypi-publish@release/v1

  # The documentation website, published to GitHub Pages by the SAME tag that published the wheel.
  #
  # THE LINE THIS JOB IS DRAWN ON. Building the site is simplon's - one command, the same one a human
  # types - and deploying it is the workflow's. Deploying really is CI/CD and nothing else: the two
  # actions below hand an artefact to the Actions artifact service and ask GitHub to serve it, and
  # neither of those exists outside an Actions run. Building, on the other hand, must work in both
  # places, and by the SAME route: `./simplon.sh build docs` here is the command a human types in a
  # checkout, so there is one truth about how the site comes to be. A workflow that called hugo itself,
  # or that reproduced the reference-then-site order in two `run:` lines, would be a second way to the
  # same end - and two ways to one end drift, quietly, until the one nobody runs by hand is the one that
  # is wrong. tests/test_release_workflow.py holds the shape.
  #
  # NO `paths:` FILTER, and none anywhere in this file: a release that touches no documentation still
  # rebuilds and republishes the site. A filter would look like an optimisation, would pass every release
  # that happens to touch docs/, and would be found out by the first one that does not - months later, by
  # somebody who was not here. The test asserts the absence, because an absence is what a reviewer cannot
  # see.
  #
  # `needs: publish` is the point of tagging rather than pushing: the site describes the version it was
  # cut from, so it goes up only once that version is on PyPI. Between two releases it ages; it never
  # documents something nobody can install.
  docs:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write           # deploy the site (and enable Pages the first time)
      id-token: write        # the same Trusted-Publishing shape as PyPI above: an OIDC token, no secret
    # Two tags in flight must not race each other onto one site; `cancel-in-progress: false` lets the
    # older one finish rather than leaving the page half-replaced.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      # fetch-depth: 0 here for UNIFORMITY, and that is the whole reason - no page carries the kernel's
      # version, and this job would go green on a shallow clone. What it would not do is stay quiet: the
      # site build installs the kernel with `-e .`, so setuptools-scm runs, and on a shallow clone it
      # prints "is shallow and may cause errors" and derives its 0.0 no-tag sentinel. A warning in a green
      # job is noise nobody chases.
      #
      # The larger reason is the rule itself. Every checkout in this repository takes the same setting, so
      # there is one rule to state and tests/test_version_source.py can assert it over the whole workflows
      # directory. An exception here would need a reader to know why, and the day the site DOES report a
      # version, nobody would remember to come back.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # One-time repository setup, idempotent afterwards: `enablement: true` turns Pages on with the
      # Actions build type. It is the workflow's business because it is about rights - the same kind of
      # setup as Trusted Publishing above - not about how the site is made.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # THE one build command, and the same one locally. It plans build.reference -> build.site out of
      # simplon.yaml, so the order the site needs (the reference is WRITTEN into the content tree the
      # site READS) is stated once, in the manifest, and not restated here. `build site` alone would
      # publish the previous run's reference; that is why the aggregate is what runs.
      #
      # Hugo runs in the pinned image via docker, which ubuntu-latest has. The container is given the
      # RUNNER's own uid (simplon.docker.user_args), so build/website/ comes out owned by `runner` and
      # the upload below can read it - measured, see the task report; the image accepts a uid that does
      # not exist inside it, which is what makes the runner's 1001 no different from a developer's.
      #
      # It also runs `hugo mod get` against the pinned theme, which WRITES site/go.mod and site/go.sum.
      # Both are committed and already agree with the pin, so the write is a no-op here - and there is
      # deliberately no "working tree clean" gate in this workflow to go red on it the day the pin moves
      # ahead of the file. Pinning the dependency is what makes the build reproducible; asserting that
      # the build changed nothing would only assert that somebody had run it locally first.
      - run: ./simplon.sh build docs
      # The deployment, and the whole of what the workflow adds. `upload-pages-artifact` tars the built
      # directory into the artifact `deploy-pages` unpacks; both talk to services that only exist inside
      # a runner, which is exactly why neither is a simplon task.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/website
      - id: deployment
        uses: actions/deploy-pages@v4
