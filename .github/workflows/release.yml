        with:
          fetch-depth: 0
          # si#622: the job's token is not left in .git/config for every step, build and tests
          # included, to read. A `token: github` step gets it in its own `env:` and hands it to git itself.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # si#344 C.4: 'simplon-formula' is produced in one job of this workflow and consumed in another, and every
      # job starts on a fresh machine. So the kernel writes its hand-off: an archive after the producing step, uploaded
      # and downloaded under the artifact's name, unpacked before the consuming step. The consuming job `needs:` this one.
      #
      # An archive and not the bare path: upload-artifact drops file permissions (its README says so and recommends
      # tar), and where it roots one path depends on whether the path is a file or a directory. The archive keeps the
      # path relative to the checkout and the mode bits, so the next job finds exactly what this one wrote.
      #
      # The archive is scratch between jobs, so it is kept a day; `overwrite` lets a re-run upload it again (one
      # producer is guaranteed, so nothing else writes that name).
      - uses: actions/download-artifact@v4
        with:
          name: simplon-formula
          path: ${{ runner.temp }}
      - run: tar -xf "${{ runner.temp }}/simplon-handoff-simplon-formula.tar"
      # si#344 C.4: 'simplon-formula-checked' is produced in one job of this workflow and consumed in another, and every
      # job starts on a fresh machine. So the kernel writes its hand-off: an archive after the producing step, uploaded
      # and downloaded under the artifact's name, unpacked before the consuming step. The consuming job `needs:` this one.
      #
      # An archive and not the bare path: upload-artifact drops file permissions (its README says so and recommends
      # tar), and where it roots one path depends on whether the path is a file or a directory. The archive keeps the
      # path relative to the checkout and the mode bits, so the next job finds exactly what this one wrote.
      #
      # The archive is scratch between jobs, so it is kept a day; `overwrite` lets a re-run upload it again (one
      # producer is guaranteed, so nothing else writes that name).
      - uses: actions/download-artifact@v4
        with:
          name: simplon-formula-checked
          path: ${{ runner.temp }}
      - run: tar -xf "${{ runner.temp }}/simplon-handoff-simplon-formula-checked.tar"
      # v3.2.0: si#534 - 'release homebrew-tap' declares `token: app`, so this step mints a GitHub App
      # token for marcozwyssig/homebrew-tap and nothing else, with contents: write, from the secrets HOMEBREW_TAP_CLIENT_ID
      # and HOMEBREW_TAP_APP_KEY. The leaf below reads it as $GH_APP_TOKEN from its own `env:`; no `run:` line
      # carries the token or a secret.
      # This step carries the leaf's `if:`, so a run that skips the leaf mints nothing and needs
      # neither secret.
      - id: app-token-0
        if: ${{ !inputs.dry_run }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.HOMEBREW_TAP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_KEY }}
          owner: marcozwyssig
          repositories: homebrew-tap
          permission-contents: write
      - if: ${{ !inputs.dry_run }}
        env:
          GH_APP_TOKEN: ${{ steps.app-token-0.outputs.token }}
        run: exec ./simplon.sh release homebrew-tap

  # The kernel image goes out with every release (Marco, 2026-10-10), for amd64 and arm64, with the
  # run's own GITHUB_TOKEN. PUBLISH FIRST, PIN AFTERWARDS: the pin moves in a pull request a person
  # merges, and CI is dispatched on it because nothing a GITHUB_TOKEN pushes starts a workflow
  # (si#365). After `publish`, so the image carries the version PyPI serves.
  # D12: an exception that waits on #789 (build once, release promotes); #864 makes it a counted `exception:`.
  image:
    runs-on: ubuntu-latest
    needs: publish
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    permissions:
      contents: write
      packages: write
      pull-requests: write
      actions: write
    steps:
      # si#756 (si#409, si#676): a cancelled job does not stop every container it started. The kernel stops
      # its containers on SIGINT and SIGTERM, but the runner's SIGKILL a few seconds into a cancel is seen by no
      # handler, and on a machine that outlives the job the container runs on - into the next job's checkout,
      # which actions/checkout is about to clean. So this runs FIRST, before the checkout.
      #
      # It removes a container only when BOTH hold: it carries `simplon.run=simplon`, the label the kernel puts on
      # every container it starts for this product, and one of its bind mounts lies in this job's workspace. The
      # runner runs one job at a time and this step runs before this job has started anything, so such a
      # container is an orphan by definition; a container of another checkout or of a developer's gate on the
      # same daemon mounts something else and is left alone. A mount given through a symlink is not matched.
      #
      # Three outcomes, kept apart: removed (each one named), nothing to remove (green, says 0), and could not
      # look - no docker client yet, or a daemon `docker ps` cannot reach - which is a warning, because the job's
      # own first docker step meets the same daemon and says why. An orphan that is still there after
      # `rm --force` fails the step: it would be writing into this job's checkout.
      - name: Remove the containers a cancelled job left running
        if: runner.environment != 'github-hosted' && runner.os != 'Windows'
        timeout-minutes: 5
        shell: bash
        run: |
          ws="${GITHUB_WORKSPACE:?}"
          if command -v docker >/dev/null 2>&1; then
            d=docker
          elif [ -x "$ws/build/tools/bin/docker" ]; then
            d="$ws/build/tools/bin/docker"
          else
            echo "::warning::orphaned containers were NOT looked for: no docker on PATH and none at $ws/build/tools/bin/docker"
            exit 0
          fi
          err="$(mktemp "${RUNNER_TEMP:-/tmp}/simplon-reap.XXXXXX")"
          if ! ids="$("$d" ps --all --quiet --no-trunc --filter label=simplon.run=simplon 2>"$err")"; then
            echo "::warning::orphaned containers were NOT looked for: '$d ps' failed: $(tr -s '[:space:]' ' ' < "$err")"
            rm -f "$err"
            exit 0
          fi
          rm -f "$err"
          # Gone only when docker SAYS so: a `ps` that fails is not an empty answer.
          gone() { out="$("$d" ps --all --quiet --no-trunc --filter "id=$1" 2>/dev/null)" && [ -z "$out" ]; }
          removed=0
          left=0
          for id in $ids; do
            if ! sources="$("$d" inspect --format '{{range .Mounts}}{{if eq .Type "bind"}}{{println .Source}}{{end}}{{end}}' "$id" 2>/dev/null)"; then
              gone "$id" && continue
              echo "::error::could not read the mounts of container $id, so it was neither kept nor removed knowingly"
              left=$((left + 1))
              continue
            fi
            printf '%s' "$sources" | awk -v ws="$ws" '$0 == ws || index($0, ws "/") == 1 { hit = 1 } END { exit !hit }' || continue
            echo "orphan: $("$d" inspect --format '{{.Name}} {{.Config.Image}} started {{.State.StartedAt}}' "$id" 2>/dev/null || echo "$id")"
            "$d" rm --force "$id" >/dev/null 2>&1 || true
            waited=0
            until gone "$id" || [ "$waited" -ge 10 ]; do sleep 1; waited=$((waited + 1)); done
            if gone "$id"; then
              echo "  removed"
              removed=$((removed + 1))
            else
              echo "::error::orphan $id is still there 10 s after docker rm --force"
              left=$((left + 1))
            fi
          done
          echo "$removed orphaned container(s) removed"
          if [ "$left" -ne 0 ]; then
            echo "::error::$left orphaned container(s) could not be removed; they would write into this job's checkout"
            exit 1
          fi
      # The full history, and it is a precondition rather than an optimisation.
      # actions/checkout defaults to a shallow clone, which carries no tags at all - so anything
      # that derives a version from one gets a wrong answer SILENTLY instead of an error. Emitted
      # by the generator rather than declared per job, so a workflow written later inherits the
      # rule instead of somebody having to remember it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # si#622: the job's token is not left in .git/config for every step, build and tests
          # included, to read. A `token: github` step gets it in its own `env:` and hands it to git itself.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # si#491 decision 5, on a REHEARSAL only: the release job's own cut, copied verbatim (a test
      # holds it equal). A dry run pushes no tag, and without it the wheel would be built as `.devN`,
      # the check below would go red, and the jobs after this one would never rehearse.
      - name: Cut the tag in this checkout
        if: ${{ inputs.dry_run }}
        run: |
          there="$(git rev-parse -q --verify "refs/tags/$RELEASE_VERSION^{commit}" || true)"
          if [ -n "$there" ] && [ "$there" != "$(git rev-parse HEAD)" ]; then
            echo "::error::$RELEASE_VERSION already exists at $there, not at this commit; choose the next version"
            exit 1
          fi
          git tag -d "$RELEASE_VERSION" >/dev/null 2>&1 || true
          git tag "$RELEASE_VERSION"
      # On a REAL run nothing is cut here: the tag must be the one the release job pushed, fetched by
      # the checkout. A tag deleted from origin after a failed publish, then "Re-run failed jobs",
      # would otherwise be re-created locally and publish a version origin does not carry - the
      # final review of si#491 (Important 2).
      - name: The tag is on origin at this commit
        if: ${{ !inputs.dry_run }}
        run: |
          tagged="$(git rev-parse -q --verify "refs/tags/$RELEASE_VERSION^{commit}" || true)"
          if [ "$tagged" != "$(git rev-parse HEAD)" ]; then
            echo "::error::$RELEASE_VERSION is not on origin at this commit (it names ${tagged:-nothing}); the release job pushes it, so rerun the whole run rather than this job alone"
            exit 1
          fi
      # The image declares linux/arm64 too (si#368); this runner is amd64.
      - uses: docker/setup-qemu-action@v3
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3
          platforms: arm64
      - run: exec ./simplon.sh build image --tag "$RELEASE_VERSION"
      - run: exec ./simplon.sh test image --tag "$RELEASE_VERSION"
      - if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: exec ./simplon.sh release push-image --tag "$RELEASE_VERSION"
      # The pin moves in three steps since si#622, because the push between them is a command: no
      # generated checkout keeps the job's token in .git/config, so `release push-pin` hands git this
      # step's GITHUB_TOKEN for that one push. This step needs none: the fetch reads a public repository.
      # What the steps after it need is handed on through $GITHUB_ENV, and PIN_BRANCH only when there
      # is a commit to push.
      - name: Commit the pin of the published image on its own branch
        if: ${{ !inputs.dry_run }}
        run: |
          ref="ghcr.io/marcozwyssig/simplon:${RELEASE_VERSION}"
          # The digest of the INDEX the tag names (si#368: one manifest list for two platforms), read from
          # the registry rather than from a local image, which holds one platform at most.
          digest="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' \
                    | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')"
          test -n "$digest" || { echo "::error::$ref was published but its digest could not be read"; exit 1; }
          branch="pin/kernel-image-${RELEASE_VERSION}"
          git fetch --quiet origin main
          git switch --quiet -c "$branch" origin/main
          rc=0; deploy/image/repin.sh "$ref" "$digest" || rc=$?
          if [ "$rc" = 3 ]; then
            echo "- **image**: \`$ref\` published; \`main\` already pins it, so no pull request." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test "$rc" = 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -am "chore: pin the kernel image to ${RELEASE_VERSION}" \
              -m "Published and read back by release run ${GITHUB_RUN_ID}: ${digest}."
          { echo "PIN_BRANCH=$branch"; echo "PIN_REF=$ref"; echo "PIN_DIGEST=$digest"; } >> "$GITHUB_ENV"
      - if: ${{ !inputs.dry_run && env.PIN_BRANCH != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: exec ./simplon.sh release push-pin --tag "$RELEASE_VERSION"
      - name: Open the pull request that pins the published image
        if: ${{ !inputs.dry_run && env.PIN_BRANCH != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A push or pull request made with this run's GITHUB_TOKEN starts no workflow (GitHub's rule
          # against one run triggering another without end), so the pin would reach its pull request
          # with no test result at all - green-looking and unexamined (si#365). `workflow_dispatch` is
          # the documented exception, and a check belongs to the COMMIT, so the run shows on the PR.
          gh workflow run ci.yml --ref "$PIN_BRANCH" || {
            echo "::error::branch $PIN_BRANCH is pushed, but ci.yml could not be dispatched on it, so its pull request would carry no test result"
            exit 1
          }
          if ! gh pr create --base main --head "$PIN_BRANCH" --title "Pin the kernel image to ${RELEASE_VERSION}" \
                 --body "Published and read back by release run ${GITHUB_RUN_ID}: \`${PIN_REF}@${PIN_DIGEST}\`. This moves \`deploy/image/image.pin\` to it (publish first, pin afterwards)."; then
            echo "::error::$PIN_REF is published and branch $PIN_BRANCH is pushed, but the pull request could not be opened. Allow it under Settings > Actions > General > 'Allow GitHub Actions to create and approve pull requests', or open it by hand: https://github.com/${GITHUB_REPOSITORY}/compare/main...${PIN_BRANCH}"
            echo "- **image**: \`$PIN_REF\` published; pin branch \`$PIN_BRANCH\` pushed; **pull request NOT opened**." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "- **image**: \`$PIN_REF@${PIN_DIGEST}\` published; pin pull request opened from \`$PIN_BRANCH\`, ci.yml dispatched on it." >> "$GITHUB_STEP_SUMMARY"

  # The website, built by `build docs` (`website: by:`) and uploaded into the run for the `pages` job. It
  # waits for `release` and for `publish` (`website: after:`), so the site never documents a version they
  # have not published. The upload is the LAST step (si#851): no step after it can turn this job red with
  # the artifact already made, so a rerun of this job never meets an upload of its own. It reads the
  # checkout and writes nothing outside the run; the Pages rights are the `pages` job's.
  docs:
    runs-on: ubuntu-latest
    needs:
      - release
      - publish
    permissions:
      contents: read
    timeout-minutes: 120
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      # si#756 (si#409, si#676): a cancelled job does not stop every container it started. The kernel stops
      # its containers on SIGINT and SIGTERM, but the runner's SIGKILL a few seconds into a cancel is seen by no
      # handler, and on a machine that outlives the job the container runs on - into the next job's checkout,
      # which actions/checkout is about to clean. So this runs FIRST, before the checkout.
      #
      # It removes a container only when BOTH hold: it carries `simplon.run=simplon`, the label the kernel puts on
      # every container it starts for this product, and one of its bind mounts lies in this job's workspace. The
      # runner runs one job at a time and this step runs before this job has started anything, so such a
      # container is an orphan by definition; a container of another checkout or of a developer's gate on the
      # same daemon mounts something else and is left alone. A mount given through a symlink is not matched.
      #
      # Three outcomes, kept apart: removed (each one named), nothing to remove (green, says 0), and could not
      # look - no docker client yet, or a daemon `docker ps` cannot reach - which is a warning, because the job's
      # own first docker step meets the same daemon and says why. An orphan that is still there after
      # `rm --force` fails the step: it would be writing into this job's checkout.
      - name: Remove the containers a cancelled job left running
        if: runner.environment != 'github-hosted' && runner.os != 'Windows'
        timeout-minutes: 5
        shell: bash
        run: |
          ws="${GITHUB_WORKSPACE:?}"
          if command -v docker >/dev/null 2>&1; then
            d=docker
          elif [ -x "$ws/build/tools/bin/docker" ]; then
            d="$ws/build/tools/bin/docker"
          else
            echo "::warning::orphaned containers were NOT looked for: no docker on PATH and none at $ws/build/tools/bin/docker"
            exit 0
          fi
          err="$(mktemp "${RUNNER_TEMP:-/tmp}/simplon-reap.XXXXXX")"
          if ! ids="$("$d" ps --all --quiet --no-trunc --filter label=simplon.run=simplon 2>"$err")"; then
            echo "::warning::orphaned containers were NOT looked for: '$d ps' failed: $(tr -s '[:space:]' ' ' < "$err")"
            rm -f "$err"
            exit 0
          fi
          rm -f "$err"
          # Gone only when docker SAYS so: a `ps` that fails is not an empty answer.
          gone() { out="$("$d" ps --all --quiet --no-trunc --filter "id=$1" 2>/dev/null)" && [ -z "$out" ]; }
          removed=0
          left=0
          for id in $ids; do
            if ! sources="$("$d" inspect --format '{{range .Mounts}}{{if eq .Type "bind"}}{{println .Source}}{{end}}{{end}}' "$id" 2>/dev/null)"; then
              gone "$id" && continue
              echo "::error::could not read the mounts of container $id, so it was neither kept nor removed knowingly"
              left=$((left + 1))
              continue
            fi
            printf '%s' "$sources" | awk -v ws="$ws" '$0 == ws || index($0, ws "/") == 1 { hit = 1 } END { exit !hit }' || continue
            echo "orphan: $("$d" inspect --format '{{.Name}} {{.Config.Image}} started {{.State.StartedAt}}' "$id" 2>/dev/null || echo "$id")"
            "$d" rm --force "$id" >/dev/null 2>&1 || true
            waited=0
            until gone "$id" || [ "$waited" -ge 10 ]; do sleep 1; waited=$((waited + 1)); done
            if gone "$id"; then
              echo "  removed"
              removed=$((removed + 1))
            else
              echo "::error::orphan $id is still there 10 s after docker rm --force"
              left=$((left + 1))
            fi
          done
          echo "$removed orphaned container(s) removed"
          if [ "$left" -ne 0 ]; then
            echo "::error::$left orphaned container(s) could not be removed; they would write into this job's checkout"
            exit 1
          fi
      # The full history, and it is a precondition rather than an optimisation.
      # actions/checkout defaults to a shallow clone, which carries no tags at all - so anything
      # that derives a version from one gets a wrong answer SILENTLY instead of an error. Emitted
      # by the generator rather than declared per job, so a workflow written later inherits the
      # rule instead of somebody having to remember it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # si#622: the job's token is not left in .git/config for every step, build and tests
          # included, to read. A `token: github` step gets it in its own `env:` and hands it to git itself.
          persist-credentials: false
      # si#491 decision 5, on a REHEARSAL only: the release job's own cut. A dry run pushes no
      # tag, and without it the site would be built for a version the checkout does not carry.
      - name: Cut the tag in this checkout
        if: ${{ inputs.dry_run }}
        run: |
          there="$(git rev-parse -q --verify "refs/tags/$RELEASE_VERSION^{commit}" || true)"
          if [ -n "$there" ] && [ "$there" != "$(git rev-parse HEAD)" ]; then
            echo "::error::$RELEASE_VERSION already exists at $there, not at this commit; choose the next version"
            exit 1
          fi
          git tag -d "$RELEASE_VERSION" >/dev/null 2>&1 || true
          git tag "$RELEASE_VERSION"
      # On a REAL run nothing is cut here: the tag must be the one the release job pushed,
      # fetched by the checkout. A tag deleted from origin after a failed publish, then "Re-run failed jobs",
      # would otherwise be re-created locally and documented as a version origin does not carry - the final
      # review of si#491 (Important 2).
      - name: The tag is on origin at this commit
        if: ${{ !inputs.dry_run }}
        run: |
          tagged="$(git rev-parse -q --verify "refs/tags/$RELEASE_VERSION^{commit}" || true)"
          if [ "$tagged" != "$(git rev-parse HEAD)" ]; then
            echo "::error::$RELEASE_VERSION is not on origin at this commit (it names ${tagged:-nothing}); the release job pushes it, so rerun the whole run rather than this job alone"
            exit 1
          fi
      - run: exec ./simplon.sh build docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  # The deploy of what `docs` uploaded, in a job of its own (si#851). In one job with the
  # upload, `deploy-pages` listed the run's artifacts one second after the upload, found no `github-pages`
  # and failed (runs 44901604309, 44938156739). Here the job boundary stands between the upload and the
  # listing. A red deploy is rerun with "Re-run failed jobs", which reruns this job alone and not `docs`,
  # which succeeded, so the rerun finds the one artifact the run holds. A FULL rerun uploads a second one,
  # and the deploy refuses two: delete the run's `github-pages` artifacts first. On GitHub-hosted Ubuntu
  # whatever the release's machine: no checkout, nothing here reads the repository, and no container is
  # started, so no reap step sits beside `pages: write` and `id-token: write`, which are this job's alone
  # (si#719), as are the environment and the queue.
  pages:
    runs-on: ubuntu-latest
    needs: docs
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
        if: ${{ !inputs.dry_run }}
