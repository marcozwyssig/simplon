# Drop-in for the CI runner's unit: refuse to start when its user cannot run a container (si#624).
#
# Install as /etc/systemd/system/actions.runner.<owner>-<repo>.<runner>.service.d/runner-docker-check.conf
# (one per runner unit - `systemctl list-units 'actions.runner.*'` names them), then `systemctl
# daemon-reload`. See https://marcozwyssig.github.io/simplon/how/ci-hosts/.
#
# ExecStartPre= runs as the unit's User= with that user's groups - the credentials the runner itself is
# about to start with - so a non-zero exit refuses the start and `systemctl status` says why.
[Service]
ExecStartPre=/usr/local/sbin/runner-docker-check.sh --self
