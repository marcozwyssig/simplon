# GENERATED from app.yaml by `app support workflows`. Do not edit.
#
# The steps below are the product's own commands, resolved against app.yaml's command tree, so
# a command that is renamed or removed breaks generation instead of leaving a workflow calling
# something that is gone. `--check` reports drift and returns 1.

name: rel
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to release, exactly as its tag will be: vX.Y.Z'
        required: true
        type: string
      dry_run:
        description: 'Rehearse: build and check everything, publish nothing'
        required: true
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:

  # si#509: no command instantiates `test:report`, so this job archives no test results. Place it
  # (`report: { task: "test:report" }` under `test`) and the job archives them.
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    timeout-minutes: 120
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      # si#756 (si#409, si#676): a cancelled job does not stop every container it started. The kernel stops
      # its containers on SIGINT and SIGTERM, but the runner's SIGKILL a few seconds into a cancel is seen by no
      # handler, and on a machine that outlives the job the container runs on - into the next job's checkout,
      # which actions/checkout is about to clean. So this runs FIRST, before the checkout.
      #
      # It removes a container only when BOTH hold: it carries `simplon.run=app`, the label the kernel puts on
      # every container it starts for this product, and one of its bind mounts lies in this job's workspace. The
      # runner runs one job at a time and this step runs before this job has started anything, so such a
      # container is an orphan by definition; a container of another checkout or of a developer's gate on the
      # same daemon mounts something else and is left alone. A mount given through a symlink is not matched.
      #
      # Three outcomes, kept apart: removed (each one named), nothing to remove (green, says 0), and could not
      # look - no docker client yet, or a daemon `docker ps` cannot reach - which is a warning, because the job's
      # own first docker step meets the same daemon and says why. An orphan that is still there after
      # `rm --force` fails the step: it would be writing into this job's checkout.
      - name: Remove the containers a cancelled job left running
        if: runner.environment != 'github-hosted' && runner.os != 'Windows'
        timeout-minutes: 5
        shell: bash
        run: |
          ws="${GITHUB_WORKSPACE:?}"
          if command -v docker >/dev/null 2>&1; then
            d=docker
          elif [ -x "$ws/build/tools/bin/docker" ]; then
            d="$ws/build/tools/bin/docker"
          else
            echo "::warning::orphaned containers were NOT looked for: no docker on PATH and none at $ws/build/tools/bin/docker"
            exit 0
          fi
          err="$(mktemp "${RUNNER_TEMP:-/tmp}/simplon-reap.XXXXXX")"
          if ! ids="$("$d" ps --all --quiet --no-trunc --filter label=simplon.run=app 2>"$err")"; then
            echo "::warning::orphaned containers were NOT looked for: '$d ps' failed: $(tr -s '[:space:]' ' ' < "$err")"
            rm -f "$err"
            exit 0
          fi
          rm -f "$err"
          # Gone only when docker SAYS so: a `ps` that fails is not an empty answer.
          gone() { out="$("$d" ps --all --quiet --no-trunc --filter "id=$1" 2>/dev/null)" && [ -z "$out" ]; }
          removed=0
          left=0
          for id in $ids; do
            if ! sources="$("$d" inspect --format '{{range .Mounts}}{{if eq .Type "bind"}}{{println .Source}}{{end}}{{end}}' "$id" 2>/dev/null)"; then
              gone "$id" && continue
              echo "::error::could not read the mounts of container $id, so it was neither kept nor removed knowingly"
              left=$((left + 1))
              continue
            fi
            printf '%s' "$sources" | awk -v ws="$ws" '$0 == ws || index($0, ws "/") == 1 { hit = 1 } END { exit !hit }' || continue
            echo "orphan: $("$d" inspect --format '{{.Name}} {{.Config.Image}} started {{.State.StartedAt}}' "$id" 2>/dev/null || echo "$id")"
            "$d" rm --force "$id" >/dev/null 2>&1 || true
            waited=0
            until gone "$id" || [ "$waited" -ge 10 ]; do sleep 1; waited=$((waited + 1)); done
            if gone "$id"; then
              echo "  removed"
              removed=$((removed + 1))
            else
              echo "::error::orphan $id is still there 10 s after docker rm --force"
              left=$((left + 1))
            fi
          done
          echo "$removed orphaned container(s) removed"
          if [ "$left" -ne 0 ]; then
            echo "::error::$left orphaned container(s) could not be removed; they would write into this job's checkout"
            exit 1
          fi
      # The full history, and it is a precondition rather than an optimisation.
      # actions/checkout defaults to a shallow clone, which carries no tags at all - so anything
      # that derives a version from one gets a wrong answer SILENTLY instead of an error. Emitted
      # by the generator rather than declared per job, so a workflow written later inherits the
      # rule instead of somebody having to remember it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # si#622: the job's token is not left in .git/config for every step, build and tests
          # included, to read. A `token: github` step gets it in its own `env:` and hands it to git itself.
          persist-credentials: false
      # si#718: the launcher's first run in a fresh checkout builds its venv - a pip install of the
      # kernel and its dependencies from PyPI. Here it happens in a step with no token in its environment, so
      # nothing that install runs sits beside the GITHUB_TOKEN a `token: github` step gets. `help` loads the
      # manifest and prints the command list; a launcher that cannot provision is red here, before the cut.
      - name: Provision the launcher before any step holds a token
        run: ./app.sh help
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: exec ./app.sh release check -- "$RELEASE_VERSION"
      - name: Cut the tag in this checkout
        run: |
          there="$(git rev-parse -q --verify "refs/tags/$RELEASE_VERSION^{commit}" || true)"
          if [ -n "$there" ] && [ "$there" != "$(git rev-parse HEAD)" ]; then
            echo "::error::$RELEASE_VERSION already exists at $there, not at this commit; choose the next version"
            exit 1
          fi
          git tag -d "$RELEASE_VERSION" >/dev/null 2>&1 || true
          git tag "$RELEASE_VERSION"
      - name: The build will be stamped with the version
        run: |
          described="$(git describe --tags --always --dirty)"
          [ "$described" = "$RELEASE_VERSION" ] || {
            echo "::error::the build would be stamped $described, not $RELEASE_VERSION"
            exit 1
          }
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: exec ./app.sh release unpublished --tag "$RELEASE_VERSION"
      - run: exec ./app.sh release notes --tag "$RELEASE_VERSION"
      - if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: exec ./app.sh release draft --tag "$RELEASE_VERSION"
      - run: exec ./app.sh build build-image
      - run: exec ./app.sh test test-image
      - if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: exec ./app.sh release publish --tag "$RELEASE_VERSION"
      - if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: exec ./app.sh release tag -- "$RELEASE_VERSION"
      - if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: exec ./app.sh release gh-publish --tag "$RELEASE_VERSION"
      - name: What a release would have published (dry run)
        if: ${{ inputs.dry_run }}
        run: |
          echo "dry run: no draft, no tag pushed, nothing published. The notes for $RELEASE_VERSION:"
          cat build/release/notes.md

