# --- ENVIRONMENTS -------------------------------------------------------------------------------
#
# One entry, and it is a formality rather than a matrix: the registry may not be empty, and no group
# in the tree above is env-first, so no command ever takes an environment token. Everything here runs
# on the machine in front of you - the build needs VMware Workstation locally, and the upload needs a
# browser you sign in to yourself.
#
# The place a second environment WOULD go is the Ivanti target, and it deliberately did not go here:
# see `release upload-ivanti` above.
default: local
environments:
  local: { backend: local, description: "This machine - VMware Workstation, and the browser you sign in with." }

