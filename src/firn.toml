# simplon's own firn project (si#371): the delivery pipeline as a model firn can check and generate from
# (si#344, si#346). Its root is src/ rather than src/firn/ since si#344 B1, because firn writes only
# below its root and the generated kinds land in src/simplon/ and src/site/. `./simplon.sh test model`
# runs `firn validate` here and `./simplon.sh build model` runs `firn gen`, both in the pinned firn image.
name = "simplon"
model = ["firn/model"]
templates = ["firn/templates"]

# The kernel's catalogue, whose hand-written part is one protected region firn keeps, the artifact
# schema (si#344 B2), a whole generated module, and one class per catalogue task in `simplon/tasks/`
# (si#400 4b).
[target.simplon]
path = "simplon"
templates = ["Catalogue", "ArtifactSchema", "Tasks"]

# The architecture's data (si#390 part 1): test code, read by src/tests/test_architecture.py, never shipped.
# Its own directory, which firn owns whole: firn v0.1.0 deletes, with rc 0, any file in a target that holds a
# line shaped like its id line - with `path = "tests"` that was src/tests/test_own_whole_files.py, whose test
# cases spell id lines (measured twice, 2026-10-13; firn#968).
[target.tests]
path = "tests/generated"
templates = ["ArchitectureData"]

# The kinds reference page and the architecture page (si#390) of the website.
[target.site]
path = "site/content/with-what"
templates = ["Docs", "ArchitecturePage"]
