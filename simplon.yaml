# Simplon builds and tests itself with itself. The very kernel built here
# assembles this CLI from this manifest -- if a commit breaks the assembly,
# it fails in the same round instead of after a release.
product: simplon
default: dev

# Simplon's own three bodies. A task is the TEMPLATE for a body, declared once here; a command under
# `groups:` is an instance of one. These three are one-off callables rather than reusable templates - no
# other product will ever place `orchestrator.cli:build_wheel` - and they are declared here anyway,
# because there is no second way to declare a body any more: the flat form that let a command carry its
# own `impl:` was deleted in si#33, and this manifest was one of the two things still written in it.
tasks:
  wheel:
    impl: "orchestrator.cli:build_wheel"
    help: "Build the wheel."
  all:
    impl: "orchestrator.cli:test_all"
    help: "Run every test."
  doctor:
    impl: "orchestrator.cli:doctor"
    help: "Check the tools and the environment."

# The command tree. `groups:` hangs off the tree the catalogue declares
# (src/simplon/catalogue.yaml: build/test/release/deploy/monitor/support) rather than inventing groups of
# its own - which is also what makes the catalogue reachable without an `import:` section: a command names
# a coordinate with `task: "<namespace>:<name>"` and the merge happens at load time.
#
# A group with no command anywhere under it does not render, so `deploy` and `monitor` are absent from
# this CLI: simplon deploys nothing and watches nothing. They are the catalogue's, not missing.
groups:
  build:
    commands:
      wheel: { task: wheel }
      # The command reference the documentation website embeds is GENERATED, so simplon generates its own
      # with the kernel it ships - the same rule that makes it build and test itself here.
      #
      # `output` is PINNED (#2, task 3): the Hugo project exists, so where the page belongs is no longer
      # an open question a caller answers on the command line. Pinned with `with:`, the parameter leaves
      # the command line entirely -- `./simplon.sh build reference` takes no arguments -- which is what
      # makes the aggregate below possible at all, since a planned step is spawned without arguments. The
      # path points INTO site/content/, because Hugo only renders what is under its content directory; the
      # generated page is gitignored there, since only the sources belong in the repo.
      reference:
        task: "docs:reference"
        with:
          output: site/content/using/commands.md
          title: "Command reference"
      # The Hugo run itself. Its five values live in the `site:` section below rather than here, because
      # they are the product's data and `docs:site` reads them through the manifest -- see
      # src/simplon/tasks/site.py.
      site: { task: "docs:site" }
      # The documentation website, as ONE command, and an impl-less AGGREGATE rather than a leaf (#2, task
      # 3). `reference` writes site/content/using/commands.md by reading the assembled CLI; `site` runs
      # Hugo over site/ and publishes into build/website/. The first WRITES a page the second READS, so
      # the order is not a preference - run them the other way round and the published site carries the
      # previous run's reference, or, the very first time, none at all.
      #
      # `depends_on` is where that ordering is stated, because the manifest is the only place it can be
      # STATED rather than merely happen. A script beside the manifest that called the two in order would
      # be a second declaration of the same fact, invisible to `plan_for`, and the kernel's own rule
      # against two sources for one thing is what the generated reference exists to enforce in the first
      # place. Siblings execute in list order, so [reference, site] IS the edge.
      #
      # It has to be an aggregate: a command either instantiates a task or plans other commands, never
      # both, so neither leaf could carry the dependency itself. `stop_on_failure` stays at its default
      # (false), deliberately: if the reference step fails, the Hugo run is still worth attempting and its
      # own verdict is still worth seeing - the site simply renders without that one page - and the
      # aggregate takes the worst rc either way, so nothing is hidden by letting the second step run.
      docs:
        help: "Write the command reference, then build the website from it."
        depends_on: [reference, site]
  test:
    commands:
      all: { task: all }
      # The type gate, on the kernel that ships it (#8). Simplon has carried `test:typecheck-python` for
      # other products since the catalogue had a `test` namespace and had never placed it for itself, so
      # `mypy src` was something a developer ran by hand or not at all - and for months the answer was 36
      # findings that everybody had agreed to read as environment noise. One of them was a real bug.
      #
      # Placed here rather than run from ci.yml directly, because a step that exists only in a workflow
      # file is a second way to do the thing: `./simplon.sh test typecheck-python` has to be the SAME
      # command in CI and on a developer's machine, or the two drift again and the next divergence is
      # discovered in the pipeline by whoever has the least context. That is the rule this repository
      # already applies to `test all` and `build wheel`, and there was never a reason for the type gate to
      # be the exception.
      #
      # No `with:` - the defaults are exactly right here: mypy.ini at the product root, mypy run in the
      # host venv (`deploy/orchestrator/requirements.txt` installs `-e .[typecheck]`, so the checker sees
      # same installed set the kernel runs against), and the roots stated by the config rather than on the
      # argv.
      typecheck-python: { task: "test:typecheck-python" }
      # The release-notes guard (si#89), on the kernel that ships it. It lived in
      # `tests/test_releases_page.py` until si#89 - which guarded simplon and nothing else, so every
      # product consuming this catalogue could tag, publish and never write a word. The mechanism is the
      # kernel's now; what stayed here is the DATA, in the `releases:` section below, and simplon's own
      # house rules about its own page, in `tests/test_releases_page.py`.
      #
      # No `with:` - there is nothing to pin. All three values are the product's data and reach the body
      # through the manifest, which is the whole shape of the ticket.
      release-notes: { task: "test:release-notes" }
  release:
    commands:
      # The release itself (#32). Simplon cuts its own releases with the command it ships, for the same
      # reason it builds and tests itself with itself: a step never run in its own house rots unseen, and
      # this one had rotted the furthest - it was the only part of the loop that lived in the README as
      # prose instead of in the manifest as a command.
      #
      # The catalogue PLACES `release:tag` itself, so this entry does not bring the command into
      # existence - it confirms the placement in this product's own tree, which is what an empty-bodied
      # refinement is for. That it lands in `release` is not a choice made here either: a coordinate that
      # opens with a phase name belongs to that phase (si#34).
      #
      # Note what is NOT here: a version. There is nowhere to put one. `pyproject.toml` declares
      # `dynamic = ["version"]`, setuptools-scm derives the number from the tag, and the tag is the
      # argument - so `./simplon.sh release tag v0.1.14` IS the whole act of choosing 0.1.14.
      tag: { task: "release:tag" }
  support:
    commands:
      doctor: { task: doctor }
      # The manifest's second output (si#40), declared here rather than placed by the catalogue for the
      # reason stated there: it reads the `workflows:` section below, so a product without one would get
      # a command that refuses on its first line. Simplon has the section, so simplon declares the
      # command - the same "used in its own house" rule that makes this repository build and test itself
      # with the kernel it ships.
      #
      # It lands in `support` because the coordinate opens with a group name, and si#34 makes that a
      # placement rather than a preference.
      workflows: { task: "support:workflows" }

# The documentation website's data (#2). Five values, every one of them required to BE declared: the
# kernel defaults none of them, because a default would be simplon's own directory layout imposed on
# every other product that places this task.
#
# `image` and `theme` must PIN a version and are refused otherwise - not `:latest`, not `@latest`, not a
# branch. A build whose output depends on the day it ran is not a build, and a documentation site is
# committed-to prose: a generator change rewrites it wholesale.
#
# `source` and `output` must be plain relative paths under the product root. That is not tidiness about
# manifests: `output` is handed to shutil.rmtree before every build, so an absolute one would delete a
# directory somewhere else entirely.
#
# THE KNOWN POINT, and the publishing job (task 4) has to know it: `theme` here is the single place the
# theme version is declared, and the task makes site/go.mod agree with it by running
# `hugo mod get <module>@<version>` before every build. That WRITES site/go.mod and refreshes
# site/go.sum in this working tree. It is idempotent while the pin and go.mod already agree - the normal
# state, and both files are committed - but the first build after the pin moves leaves a real diff. A CI
# gate asserting "working tree clean" after a site build would go red on the mechanism working correctly.
site:
  image: "hugomods/hugo:exts-0.148.2"
  source: "site"
  output: "build/website"
  base_url: "https://marcozwyssig.github.io/simplon/"
  theme: "github.com/imfing/hextra@v0.12.3"

# The release notes' three values (si#89), and there is nothing else the kernel may know about them.
#
# `page` is where they live; `from` is the first release that must have a section at all; `complete_from`
# is the first section that must name every ticket merged into its range. The gap between the two floors
# IS the excused set, and here it is exactly one release: 0.4.0's notes were written before the rule and
# name no number anywhere. Retro-fitting them would mean deciding, a release later, which paragraph each
# of SIXTEEN numbers belongs beside - measured today over v0.3.0..v0.4.0's thirteen merges - and two of
# them have no paragraph at all, so it would mean writing new prose about a released version from the
# outside. That is reconstruction, which is the objection the page's own floor paragraph raises against
# writing the older releases up at all.
#
# The old wording said FIFTEEN, and that number was already stale when it was carried here: si#103's rule
# reads a web merge one level down, which found one more. A typed count going wrong is the defect this
# repository has now proved five times, and it happened again inside the comment explaining an exemption
# against it. The count is stated here as measured on a date rather than as a standing fact, and what
# holds it is the assertion in tests/test_releases_page.py, not this sentence.
#
# The exemption is PAID FOR rather than merely declared, and not here: `tests/test_releases_page.py` pins
# the excused population at one and requires it to be genuinely incomplete, so the day somebody writes
# those numbers in, the suite says to move `complete_from` down and delete the exemption. Those are
# simplon's own house rules about simplon's own page, which is exactly why they did not move into the
# kernel with the mechanism.
releases:
  page: "site/content/using/releases.md"
  from: "0.4.0"
  complete_from: "0.5.0"

# The workflow declarations (si#40). "One source, two outputs" has stood in
# src/simplon/orchestrator/manifest.py since it was written: the same manifest assembles the runtime CLI,
# and - this is that second output - the CI workflows.
#
# WHAT IS HERE AND WHAT IS NOT. The runner image, the trigger, the interpreter version and the
# permissions are declared, because the kernel cannot know them and must not guess: whether a tag
# publishes is this product's statement. The step SEQUENCE is not declared twice - a step says
# `command: test all`, and the generator resolves that against the command tree above before writing
# `./simplon.sh test all`. Rename `test all` and generation fails; today, renaming it would leave a
# workflow calling a command that is gone, and the first anybody would hear of it is a red runner.
#
# The checkout is not declared either. `fetch-depth: 0` is si#3's invariant - a shallow clone makes
# setuptools-scm derive a version that is merely wrong rather than failing - and the generator emits it,
# so a workflow written next year inherits the rule instead of somebody having to remember it.
#
# COMMENTS ARE CARRIED. Every `note:` below is rendered as a comment block in the generated file, in the
# position it is declared in. That is a requirement rather than a nicety: a generator that dropped the
# reasoning would make these files worse than the hand-written ones it replaced.
workflows:

  ci:
    note: |
      Every push and every pull request, and it is the SAME three commands a developer types in a
      checkout - not a pipeline's own spelling of them. Two routes to one verdict is the shape that
      produced si#8, where the CI was green for months because it had never run mypy at all.
    # VERBATIM product data: whether a push runs the suite is nothing the kernel can derive.
    on: [push, pull_request]
    jobs:
      self-build:
        note: |
          Stage zero is the working tree. The launcher provisions its own venv and installs this
          checkout with `-e .`, so the code under test is the code that runs the test - a commit that
          breaks CLI assembly fails here, in the same round, rather than after a release.

          Why the full history below matters to THIS product in particular (si#3): the version is
          derived from the git tag by setuptools-scm, so a shallow clone makes it produce a version
          that is merely wrong rather than failing - and on the release path PyPI accepts the wheel.
          The kernel emits the setting and states what it does; this is simplon's own reason for
          caring, which no other product has to inherit.
        runs-on: ubuntu-latest
        python: "3.12"
        steps:
          - command: test all
          - note: |
              The type gate (si#8), and it runs HERE rather than as a `mypy src` step of its own,
              because the command has to be the same one a developer runs. si#8 was raised as "mypy is
              red locally and green in CI, so it must be the Python version" - and the CI had simply
              never run mypy at all. Two ways to reach one verdict is the shape that produced that; one
              way is the fix. What it checks and what it excuses is stated in mypy.ini, not here.
            command: test typecheck-python
          - command: build wheel
          - note: |
              The release-notes guard (si#89), and it is LAST on purpose. A gate that fails early
              hides everything behind it, and this one rules on prose rather than on code: a
              release section still to be written must not stop a reader from seeing whether the
              suite, the type gate and the wheel are green. It is a real gate all the same - a
              tagged release nobody wrote up is a failure this repository has already shipped once.

              Its range is `<last tag>..HEAD` of whatever this run checked out, so it says
              different things under the two triggers this workflow declares, and both are
              correct: a `push` to main has the merge that just landed in range, and a
              `pull_request` run checks out `refs/pull/N/merge` - the branch AS MERGED with the
              base - so a branch green on its own tip goes red when the base moves. The command
              prints what HEAD resolved to on every run, which is what makes that legible instead
              of surprising. `fetch-depth: 0` above is a precondition for it too: with no tags
              there is no released version to measure the page against.
            command: test release-notes

  # DECLARED HAND-WRITTEN, which is a decision and not a gap - si#40 asked for exactly this to be an
  # explained possibility rather than an emergency exit. The generator carries comments, so prose is not
  # what keeps this file out; what keeps it out is that release.yml is roughly two-thirds reasoning and
  # carries two multi-line shell scripts (the report on whether a tag sits on `main`, and the check that
  # the wheel which was built is the tag), and moving those into this manifest would move the work
  # without reducing it. It stays hand-written, and it stays NAMED - so it is accounted for rather than
  # merely unmanaged, which is the state si#40 exists to make impossible.
  release:
    handwritten: >-
      two-thirds prose and two multi-line shell scripts (the on-main report of si#23, the
      wheel-is-the-tag check of si#3); declaring it would move that work rather than remove it
