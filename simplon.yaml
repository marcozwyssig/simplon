# Simplon builds and tests itself with itself. The very kernel built here
# assembles this CLI from this manifest -- if a commit breaks the assembly,
# it fails in the same round instead of after a release.
product: simplon
default: dev

# NOTE: no `commands:` nesting under each group. That shape is the manifest loader's "new form", reserved
# for a command that INSTANTIATES a task declared under `tasks:` (`task: <name>`, netctl catalogue
# coordinates included) - it rejects a bare `impl:` outright ("declare the body once under `tasks:` and
# point this command at it with `task:`"). build/test/support are also catalogue coordinates (see
# src/simplon/catalogue.yaml), but simplon's own three commands are one-off callables, not reusable task
# templates, so this stays the flat "old form": group -> command name -> spec, `impl:` straight on the
# command. Same CLI surface either way (`simplon build wheel`, `simplon test all`, `simplon support
# doctor`); only the internal schema differs.
groups:
  build:
    wheel:
      help: "Build the wheel."
      impl: "orchestrator.cli:build_wheel"
  test:
    all:
      help: "Run every test."
      impl: "orchestrator.cli:test_all"
  support:
    doctor:
      help: "Check the tools and the environment."
      impl: "orchestrator.cli:doctor"

# The command reference the documentation website embeds is GENERATED, so simplon generates its own with
# the kernel it ships - the same rule that makes it build and test itself here. Placed through `import:`
# + `tasks:` because this manifest is still the flat old form throughout: that is the old form's way of
# instantiating a catalogue coordinate, and it needs no group migration to work. The output path is not
# pinned yet - the Hugo project does not exist in this repo yet (#2, task 3) - so `output` stays the
# positional argument the task declares, and `./simplon.sh build reference <path>` writes the page.
import:
  delivery: [docs]
tasks:
  docs:reference:
    group: build
