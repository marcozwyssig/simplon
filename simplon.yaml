# Simplon builds and tests itself with itself. The very kernel built here
# assembles this CLI from this manifest -- if a commit breaks the assembly,
# it fails in the same round instead of after a release.
product: simplon
default: dev

# NOTE: no `commands:` nesting under each group. That shape is the manifest loader's "new form", reserved
# for a command that INSTANTIATES a task declared under `tasks:` (`task: <name>`, netctl catalogue
# coordinates included) - it rejects a bare `impl:` outright ("declare the body once under `tasks:` and
# point this command at it with `task:`"). build/test/support are also catalogue coordinates (see
# src/simplon/catalogue.yaml), but simplon's own three commands are one-off callables, not reusable task
# templates, so this stays the flat "old form": group -> command name -> spec, `impl:` straight on the
# command. Same CLI surface either way (`simplon build wheel`, `simplon test all`, `simplon support
# doctor`); only the internal schema differs.
groups:
  build:
    wheel:
      help: "Build the wheel."
      impl: "orchestrator.cli:build_wheel"
    # The documentation website, as ONE command, and an impl-less AGGREGATE rather than a leaf (#2, task
    # 3). `reference` writes site/content/using/commands.md by reading the assembled CLI; `site` runs Hugo
    # over site/ and publishes into build/website/. The first WRITES a page the second READS, so the order
    # is not a preference - run them the other way round and the published site carries the previous run's
    # reference, or, the very first time, none at all.
    #
    # `depends_on` is where that ordering is stated, because the manifest is the only place it can be
    # STATED rather than merely happen. A script beside the manifest that called the two in order would be
    # a second declaration of the same fact, invisible to `plan_for`, and the kernel's own rule against two
    # sources for one thing is what the generated reference exists to enforce in the first place. Siblings
    # execute in list order, so [reference, site] IS the edge.
    #
    # It has to be an aggregate: `impl` and `depends_on` are mutually exclusive, so neither leaf could
    # carry the dependency itself. `stop_on_failure` stays at its default (false), deliberately: if the
    # reference step fails, the Hugo run is still worth attempting and its own verdict is still worth
    # seeing - the site simply renders without that one page - and the aggregate takes the worst rc
    # either way, so nothing is hidden by letting the second step run.
    docs:
      help: "Write the command reference, then build the website from it."
      depends_on: [reference, site]
  test:
    all:
      help: "Run every test."
      impl: "orchestrator.cli:test_all"
  support:
    doctor:
      help: "Check the tools and the environment."
      impl: "orchestrator.cli:doctor"

# The command reference the documentation website embeds is GENERATED, so simplon generates its own with
# the kernel it ships - the same rule that makes it build and test itself here. Both documentation tasks
# are placed through `import:` + `tasks:` because this manifest is still the flat old form throughout:
# that is the old form's way of instantiating a catalogue coordinate, and it needs no group migration to
# work. The command NAME is the coordinate's second half under that form, which is why the two commands
# are `build reference` and `build site` and the aggregate over them had to be called something else.
import:
  delivery: [docs, test, release]
tasks:
  # `output` is PINNED now (#2, task 3): the Hugo project exists, so where the page belongs is no longer
  # an open question a caller answers on the command line. Pinned with `with:`, the parameter leaves the
  # command line entirely - `./simplon.sh build reference` takes no arguments - which is what makes the
  # aggregate above possible at all, since a planned step is spawned without arguments. The path points
  # INTO site/content/, because Hugo only renders what is under its content directory; the generated page
  # is gitignored there, since only the sources belong in the repo.
  docs:reference:
    group: build
    with:
      output: site/content/using/commands.md
      title: "Command reference"
  # The Hugo run itself. Its five values live in the `site:` section below rather than here, because they
  # are the product's data and `docs:site` reads them through the manifest - see src/simplon/tasks/site.py.
  docs:site:
    group: build
  # The type gate, on the kernel that ships it (#8). Simplon has carried `test:typecheck-python` for other
  # products since the catalogue had a `test` namespace and had never placed it for itself, so `mypy src`
  # was something a developer ran by hand or not at all - and for months the answer was 36 findings that
  # everybody had agreed to read as environment noise. One of them was a real bug.
  #
  # Placed here rather than run from ci.yml directly, because a step that exists only in a workflow file
  # is a second way to do the thing: `./simplon.sh test typecheck-python` has to be the SAME command in CI and on
  # a developer's machine, or the two drift again and the next divergence is discovered in the pipeline by
  # whoever has the least context. That is the rule this repository already applies to `test all` and
  # `build wheel`, and there was never a reason for the type gate to be the exception.
  #
  # No `with:` - the defaults are exactly right here: mypy.ini at the product root, mypy run in the host
  # venv (`orchestrator/requirements.txt` installs `-e .[typecheck]`, so the checker sees the same
  # installed set the kernel runs against), and the roots stated by the config rather than on the argv.
  test:typecheck-python:
    group: test
  # The release itself (#32). Simplon cuts its own releases with the command it ships, for the same
  # reason it builds and tests itself with itself: a step never run in its own house rots unseen, and
  # this one had rotted the furthest - it was the only part of the loop that lived in the README as
  # prose instead of in the manifest as a command.
  #
  # `group: release` is not a choice made here. `release:tag` is a `release` coordinate, and a
  # coordinate that opens with a phase name belongs to that phase; the kernel's own catalogue places it
  # in exactly the same group for every product that adopts the new manifest form. This entry is the
  # old form's way of saying the same thing, and it is what brings the `release` group into existence in
  # this CLI - simplon had none, because until now it published nothing it had a command for.
  #
  # Note what is NOT here: a version. There is nowhere to put one. `pyproject.toml` declares
  # `dynamic = ["version"]`, setuptools-scm derives the number from the tag, and the tag is the
  # argument - so `./simplon.sh release tag v0.1.14` IS the whole act of choosing 0.1.14.
  release:tag:
    group: release

# The documentation website's data (#2). Five values, every one of them required to BE declared: the
# kernel defaults none of them, because a default would be simplon's own directory layout imposed on
# every other product that places this task.
#
# `image` and `theme` must PIN a version and are refused otherwise - not `:latest`, not `@latest`, not a
# branch. A build whose output depends on the day it ran is not a build, and a documentation site is
# committed-to prose: a generator change rewrites it wholesale.
#
# `source` and `output` must be plain relative paths under the product root. That is not tidiness about
# manifests: `output` is handed to shutil.rmtree before every build, so an absolute one would delete a
# directory somewhere else entirely.
#
# THE KNOWN POINT, and the publishing job (task 4) has to know it: `theme` here is the single place the
# theme version is declared, and the task makes site/go.mod agree with it by running
# `hugo mod get <module>@<version>` before every build. That WRITES site/go.mod and refreshes
# site/go.sum in this working tree. It is idempotent while the pin and go.mod already agree - the normal
# state, and both files are committed - but the first build after the pin moves leaves a real diff. A CI
# gate asserting "working tree clean" after a site build would go red on the mechanism working correctly.
site:
  image: "hugomods/hugo:exts-0.148.2"
  source: "site"
  output: "build/website"
  base_url: "https://marcozwyssig.github.io/simplon/"
  theme: "github.com/imfing/hextra@v0.12.3"
